<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Sorting Visualizer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Sorting Visualizer</h1>

  <div class="controls">
    <button id="new-array-btn">New Array</button>
    <button id="bubble-sort-btn">Bubble Sort</button>
    <button id="selection-sort-btn">Selection Sort</button>
    <button id="insertion-sort-btn">Insertion Sort</button>
    <button id="merge-sort-btn">Merge Sort</button>
    <label for="speed-slider">Speed</label>
    <input type="range" id="speed-slider" min="1" max="100" value="80" />
    <label for="size-slider">Array Size</label>
    <input type="range" id="size-slider" min="10" max="150" value="40" />
  </div>

  <div id="bars-container"></div>

  <script src="script.js"></script>
</body>
</html>
